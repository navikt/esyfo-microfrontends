version: 2

registries:
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}

updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries: '*'
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      navikt:
        patterns:
          - "@navikt/*"
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      vite:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      aksel-dependencies:
        patterns:
          - '@navikt/aksel*'
          - '@navikt/ds*'
      react-dependencies:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # pnpm/action-setup v6 bundler pnpm 11 som er inkompatibelt med vår pnpm 10 lockfile.
    # Fjern denne ignore-regelen når repoet migrerer til pnpm 11.
    ignore:
      - dependency-name: "pnpm/action-setup"
        update-types:
          - "version-update:semver-major"
    groups:
      actions:
        patterns:
          - "*"
