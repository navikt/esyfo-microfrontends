name: Deploy dialogmote

on:
  push:
    branches:
      - "main"
    paths:
      - "microfrontends/dialogmote/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-dialogmote.yaml"
      - ".github/workflows/deploy-microfrontend-reusable.yml"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-microfrontend-reusable.yml
    with:
      microfrontend_name: "dialogmote"
      manifest_id: "syfo-dialog"
      enable_prod: false
    secrets: inherit
