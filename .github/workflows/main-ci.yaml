name: Main CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/instructions/**"
      - ".github/skills/**"
      - "LICENSE"

permissions:
  contents: read
  packages: read

jobs:
  ci:
    name: Reusable CI
    uses: ./.github/workflows/ci-reusable.yml
