name: Reusable microfrontend deploy

on:
  workflow_call:
    inputs:
      microfrontend_name:
        description: Base microfrontend name used to derive deploy configuration
        required: true
        type: string
      manifest_id:
        description: TMS microfrontend id
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.microfrontend_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.microfrontend_name }}
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - uses: "pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320" # v5.0.0
      - uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: "https://npm.pkg.github.com"
          cache: "pnpm"

      - name: Install dependencies
        run: "pnpm install --frozen-lockfile"
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application
        run: "pnpm run ${{ format('build:{0}-microfrontend', inputs.microfrontend_name) }}"

      - name: Prepare deployment artifact
        run: pnpm --filter "${MICROFRONTEND_NAME}-microfrontend" --prod deploy --ignore-scripts ".deploy/${MICROFRONTEND_NAME}"
        env:
          MICROFRONTEND_NAME: ${{ inputs.microfrontend_name }}

      - name: Verify deployment artifact
        run: |
          node -e "require('./.deploy/${MICROFRONTEND_NAME}/node_modules/sharp')"

          forbidden_path="$(
            find ".deploy/${MICROFRONTEND_NAME}/node_modules" \
              \( -path "*/node_modules/.pnpm/@esbuild+*" \
              -o -path "*/node_modules/.pnpm/esbuild@*" \
              -o -path "*/node_modules/.pnpm/lefthook*" \
              -o -path "*/node_modules/.pnpm/@esyfo+*" \
              -o -path "*/node_modules/.pnpm/node_modules/@esbuild*" \
              -o -path "*/node_modules/.pnpm/node_modules/esbuild" \
              -o -path "*/node_modules/.pnpm/node_modules/lefthook*" \
              -o -path "*/node_modules/@esyfo*" \) \
              -print -quit
          )"

          if [ -n "${forbidden_path}" ]; then
            echo "Deployment artifact contains build-time packages:"
            echo "${forbidden_path}"
            exit 1
          fi
        env:
          MICROFRONTEND_NAME: ${{ inputs.microfrontend_name }}

      - name: Upload to cdn
        uses: "nais/deploy/actions/cdn-upload/v2@027a91857992525139798892f2804b0ca21f4af6" # v2
        with:
          team: "team-esyfo"
          source: ${{ format('./microfrontends/{0}/dist/client/_astro', inputs.microfrontend_name) }}
          destination: ${{ format('{0}-microfrontend', inputs.microfrontend_name) }}

      - name: Build and push
        uses: "nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0" # v0
        id: docker-build-push
        with:
          team: "team-esyfo"
          dockerfile: ${{ format('./microfrontends/{0}/Dockerfile', inputs.microfrontend_name) }}
          image_suffix: ${{ inputs.microfrontend_name }}

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  update-manifest-dev:
    name: Update manifest dev
    permissions:
      contents: "read"
      id-token: "write"
    uses: "navikt/tms-deploy/.github/workflows/oppdater-mikrofrontend-manifest-v3.yaml@67dc876fb9e1a0b115e47a36fd46a1c7b0064d4c" # main
    needs: build
    with:
      id: ${{ inputs.manifest_id }}
      url: ${{ format('http://{0}-microfrontend.team-esyfo', inputs.microfrontend_name) }}
      appname: ${{ format('{0}-microfrontend', inputs.microfrontend_name) }}
      namespace: "team-esyfo"
      cluster: "dev-gcp"
      commitmsg: ${{ github.event.head_commit.message || format('Manual deploy from {0} ({1})', github.ref_name, github.sha) }}
      fallback: "fallback"
      ssr: true
    secrets: inherit

  deploy-dev:
    name: Deploy to dev
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build, update-manifest-dev]
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: Deploy to dev
        uses: "nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6" # v2
        env:
          CLUSTER: "dev-gcp"
          RESOURCE: ${{ format('microfrontends/{0}/nais/dev-gcp/nais.yaml', inputs.microfrontend_name) }}
          VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}

  update-manifest-prod:
    name: Update manifest prod
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: "read"
      id-token: "write"
    uses: "navikt/tms-deploy/.github/workflows/oppdater-mikrofrontend-manifest-v3.yaml@67dc876fb9e1a0b115e47a36fd46a1c7b0064d4c" # main
    needs: build
    with:
      id: ${{ inputs.manifest_id }}
      url: ${{ format('http://{0}-microfrontend.team-esyfo', inputs.microfrontend_name) }}
      appname: ${{ format('{0}-microfrontend', inputs.microfrontend_name) }}
      namespace: "team-esyfo"
      cluster: "prod-gcp"
      commitmsg: ${{ github.event.head_commit.message || format('Manual deploy from {0} ({1})', github.ref_name, github.sha) }}
      fallback: "fallback"
      ssr: true
    secrets: inherit

  deploy-prod:
    name: Deploy to prod
    if: github.ref == 'refs/heads/main'
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      id-token: "write"
    needs: [build, update-manifest-prod]
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
      - name: Deploy to prod
        uses: "nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6" # v2
        env:
          CLUSTER: "prod-gcp"
          RESOURCE: ${{ format('microfrontends/{0}/nais/prod-gcp/nais.yaml', inputs.microfrontend_name) }}
          VAR: image=${{ needs.build.outputs.image }},version=${{ github.sha }}
