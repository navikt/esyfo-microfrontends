name: Reusable CI

on:
  workflow_call:
    secrets:
      npm-auth-token:
        required: true

jobs:
  lint-and-checks:
    name: Lint and checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
      - run: pnpm run lint
      - run: pnpm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
      - run: pnpm run test

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
      - run: pnpm run build-storybook

  build-microfrontends:
    name: Build ${{ matrix.microfrontend }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - microfrontend: dialogmote
            script: build:dialogmote-microfrontend
          - microfrontend: aktivitetskrav
            script: build:aktivitetskrav-microfrontend
          - microfrontend: meroppfolging
            script: build:meroppfolging-microfrontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://npm.pkg.github.com"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-auth-token }}
      - run: pnpm run ${{ matrix.script }}
