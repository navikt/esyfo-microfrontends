apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: meroppfolging-microfrontend
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  tokenx:
    enabled: true
  image: "{{ image }}"
  port: 3000
  liveness:
    path: /api/internal/isAlive
    initialDelay: 10
  readiness:
    path: /api/internal/isReady
    initialDelay: 10
  replicas:
    min: 2
    max: 4
  accessPolicy:
    inbound:
      rules:
        - application: tms-min-side
          namespace: min-side
    outbound:
      rules:
        - application: meroppfolging-backend
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: "20m"
      memory: 128Mi
  env:
    - name: MEROPPFOLGING_BACKEND_HOST
      value: "http://meroppfolging-backend"
    - name: MEROPPFOLGING_CLIENT_ID
      value: "prod-gcp:team-esyfo:meroppfolging-backend"
    - name: SSPS_URL
      value: "https://www.nav.no/syk/meroppfolging/snart-slutt-pa-sykepengene"
    - name: KARTLEGGING_URL
      value: "https://www.nav.no/syk/kartleggingssporsmal"
